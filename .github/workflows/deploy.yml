name: Deploy Optimized Site to GCS

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python (for gsutil)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: clearance-site-6969
          install_components: 'gsutil'

      - name: Gzip compress and upload to GCS (with Vary header)
        run: |
          find . -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.csv" \) \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -name ".DS_Store" \
            ! -name "gha-creds-*.json" | while read file; do
              ext="${file##*.}"
              target_path="${file#./}"
              case "$ext" in
                html) mime="text/html"; encoding="gzip" ;;
                css)  mime="text/css"; encoding="gzip" ;;
                js)   mime="application/javascript"; encoding="gzip" ;;
                csv)  mime="text/csv"; encoding="gzip" ;;
              esac

              gsutil -h "Content-Type:$mime" \
                     -h "Content-Encoding:$encoding" \
                     -h "Vary: Accept-Encoding" \
                     -h "Cache-Control:public,max-age=31536000" \
                     cp <(gzip -c "$file") gs://clearance-site-bucket/$target_path
          done

          # Upload all other static assets (e.g., images), excluding sensitive files
          find . -type f \
            ! \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.csv" \) \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -name ".DS_Store" \
            ! -name "gha-creds-*.json" | while read file; do
              target_path="${file#./}"
              mime=$(file --mime-type -b "$file")

              gsutil -h "Content-Type:$mime" \
                     -h "Cache-Control:public,max-age=31536000" \
                     cp "$file" gs://clearance-site-bucket/$target_path
          done
