name: Deploy Optimized Site to GCS

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python (for gsutil)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: clearance-site-6969
          install_components: 'gsutil'

      - name: Gzip HTML/CSS/JS and prepare public folder
        run: |
          mkdir -p public
          for file in $(find . -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \)); do
            mkdir -p "public/$(dirname "$file")"
            gzip -c "$file" > "public/$file"
          done
          # Copy non-compressible assets (images, fonts, etc.)
          rsync -av --exclude='*.html' --exclude='*.css' --exclude='*.js' ./ public/

      - name: Upload compressed and static assets to GCS
        run: |
          find public -type f | while read file; do
            ext="${file##*.}"
            target_path="${file#public/}"
            case "$ext" in
              html) mime="text/html"; encoding="gzip" ;;
              css)  mime="text/css"; encoding="gzip" ;;
              js)   mime="application/javascript"; encoding="gzip" ;;
              *)    mime=$(file --mime-type -b "$file"); encoding="" ;;
            esac

            if [[ "$encoding" == "gzip" ]]; then
              gsutil -h "Content-Type:$mime" \
                     -h "Content-Encoding:$encoding" \
                     -h "Cache-Control:public,max-age=31536000" \
                     cp "$file" gs://clearance-site-bucket/$target_path
            else
              gsutil -h "Content-Type:$mime" \
                     -h "Cache-Control:public,max-age=31536000" \
                     cp "$file" gs://clearance-site-bucket/$target_path
            fi
          done



