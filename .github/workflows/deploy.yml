name: Deploy Optimized Site to GCS

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python (for gsutil)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: clearance-site-6969
          install_components: 'gsutil'

      - name: Gzip compress key files and prepare public folder
        run: |
          mkdir -p public

          # Compress selected file types, excluding sensitive paths
          find . \
            -type f \
            \( -name "*.html" -o -nam*
